services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/vexatrade_certificate
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-this-to-a-long-random-secret
      JWT_REFRESH_SECRET: change-this-to-a-different-long-random-secret
      SESSION_SECRET: change-this-to-a-long-random-session-secret
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongo
      - redis
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
  logs:
